[project]
name = "bluesurf-mcp"
version = "0.3.0"
description = "Servidor MCP local para leer tickets de BlueSurf, adjuntar archivos y publicar comentarios"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "BluePeople" }]
keywords = ["bluesurf", "mcp", "tickets"]
dependencies = [
    "httpx>=0.27",
    "mcp>=2.0",
    "keyring>=25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.0",
]

[project.scripts]
bluesurf-mcp = "bluesurf_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bluesurf_client", "bluesurf_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
